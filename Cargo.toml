[package]
name = "interlint"
version = "0.1.0"
edition = "2021"

[dependencies]
# Parsing
tree-sitter = "0.26.7"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"

# CLI
clap = { version = "4.6.0", features = ["derive"] }

# Network
reqwest = { version = "0.13.2", features = ["rustls"] }
tokio = { version = "1.50.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Tarball extraction
tar = "0.4"
flate2 = "1.0"

# Utilities
tempfile = "3.27"
anyhow = "1.0"
thiserror = "2.0"

# Output
indicatif = "0.18"
owo-colors = "4.3"
supports-color = "3.0"
