[package]
name = "interlint"
version = "0.1.0"
edition = "2021"
autotests = false

[features]
lsp-tests = []

[[bin]]
name = "interlint"
path = "src/main.rs"

[lib]
name = "interlint"
path = "src/lib.rs"

[dependencies]
# Parsing
tree-sitter = "0.26.7"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-css = "0.25.0"

# CLI
clap = { version = "4.6.0", features = ["derive"] }

# Network
reqwest = { version = "0.13.2", features = ["rustls", "json", "stream"] }
futures-util = "0.3"
tokio = { version = "1.50.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
indexmap = "2.13"

# Tarball extraction
tar = "0.4"
flate2 = "1.0"

# Semver range parsing (npm-flavored)
node-semver = "2.2.0"

# Utilities
tempfile = "3.27"
anyhow = "1.0"
thiserror = "2.0"

# Output
indicatif = "0.18"
owo-colors = "4.3"
supports-color = "3.0"

# LSP client
async-lsp = "0.2.3"
tower = "0.5"
tokio-util = { version = "0.7", features = ["compat"] }

# Utilities
dirs = "6.0.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[test]]
name = "core"
path = "tests/core/main.rs"

[[test]]
name = "javascript"
path = "tests/languages/javascript/main.rs"

[[test]]
name = "typescript"
path = "tests/languages/typescript/main.rs"

[[test]]
name = "node"
path = "tests/ecosystems/node/main.rs"

# Manual snapshot generator, kept beside the reference harness.
[[example]]
name = "reference_suite_dump"
path = "tests/ecosystems/node/reference/dump.rs"
