[package]
name = "interlint-format"
version = "0.1.0"
edition = "2021"
description = "Language-agnostic format for describing code signatures and exports"
license = "MIT"

[dependencies]
serde = { version = ">=1.0.197, <1.0.205", features = ["derive"] }
rmp-serde = "1.1"
crc32fast = "1"
thiserror = "1"

[dev-dependencies]
proptest = "1"
