name: Pledge package compatibility
description: Check a built JavaScript or TypeScript package against its published npm interface
branding:
  icon: shield
  color: blue
inputs:
  path:
    description: Optional package directory; omit to discover publishable root and workspace packages
    required: false
    default: ''
  against:
    description: Optional published version or npm dist-tag; omit to select the highest published version in each package's major
    required: false
    default: ''
outputs:
  status:
    description: clean, advisory (0.x breaking findings), breaking, error, or incomplete
  exit-code:
    description: Pledge exit code (0, 1, 2, or 3)
runs:
  using: docker
  image: docker://ghcr.io/stentorian-io/pledge:v0.4.0 # x-release-please-version
  entrypoint: node
  args:
    - /usr/local/lib/pledge/action.cjs
    - ${{ inputs.path }}
    - ${{ inputs.against }}
