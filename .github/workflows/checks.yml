name: Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare Rust and compiler integration tests
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy,llvm-tools-preview
          rustup default stable
          cargo install cargo-llvm-cov --locked
          npm install -g typescript@5.9.3 typescript-language-server@5.1.3
      - run: bun scripts/releases/check-commits.ts
      - run: bun scripts/releases/check-version.ts
      - run: make check-all

  compiler-versions:
    name: TypeScript ${{ matrix.typescript }} on Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        typescript: ['4.9.5', '5.0.4', '5.2.2', '5.4.5', '5.7.3', '5.9.3', '6.0.3']
        node: ['22.12.0', '24.0.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Prepare compiler version
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          npm install -g typescript@${{ matrix.typescript }}
      - run: >-
          cargo test --locked --release --features lsp-tests --test typescript --test javascript --
          compiler::version_support::
          compiler::contracts::returned_contracts
          compiler::contracts::callables
          compiler::contracts::overloads
          compiler::contracts::nominal_identities
          compiler::contracts::javascript_interop
          compiler::enrichment::namespace_default_members_retain_compiler_types
          compiler::enrichment::unresolved_commonjs_factory_results_retain_missing_runtime_evidence
          compiler::enrichment::unresolved_commonjs_symbol_keys_retain_missing_runtime_evidence
          modules::path_aliases::
          modules::forwarding::
          runtime::consumer_contracts::inferred_commonjs_values_agree_with_require_consumers
          --test-threads=1

  commonjs-loaders:
    name: CommonJS named imports on Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '24.0.0', '26.7.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: >-
          cargo test --locked --release --features lsp-tests --test node --
          modules::commonjs_names:: --test-threads=1
