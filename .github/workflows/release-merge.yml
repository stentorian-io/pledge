name: Merge routine release

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Evaluate eligibility without merging
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  merge:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        with:
          script: |
            const mergeRelease = require('./scripts/releases/merge-release.cjs');
            await mergeRelease({ github, context, core,
              dryRun: process.env.RELEASE_DRY_RUN === 'true' });
