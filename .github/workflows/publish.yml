name: Publish release artifacts

on:
  workflow_call:
    inputs:
      tag:
        description: Exact vX.Y.Z release tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Exact vX.Y.Z release tag to publish or retry
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Authenticate the repository publisher
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Verify and publish the tagged Linux image and binary
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            const { publishRelease } = require('./scripts/releases/publish-release.cjs');
            await publishRelease({ github, context, core, tag: process.env.RELEASE_TAG });
