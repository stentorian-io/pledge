[package]
name = "breakpoint"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { version = "1.0.80", default-features = false, features = ["std"] }
base64 = { version = "0.21.7", default-features = false, features = ["alloc", "std"] }
flate2 = { version = "1.0.28", default-features = false, features = ["zlib"] }
glob = { version = "0.3.1", default-features = false }
hmac-sha512 = { version = "1.1.5", default-features = false }
interlint-format = { path = "../format" }
json = { version = "0.12.4", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "blocking"] }
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
strum = { version = "0.26.1", default-features = false }
strum_macros = { version = "0.26.1", default-features = false }
tar = { version = "0.4.40", default-features = false }
url = { version = "2.5.0", default-features = false }

# Tree-sitter parsing
tree-sitter = "0.24"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
streaming-iterator = "0.1"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
serde_json = "1.0"
tempfile = "3.10"
